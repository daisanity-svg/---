<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9df"><title>Mounjaro Journey</title><style>:root{--paper:#eee9df;--ink:#252820;--muted:#74786e;--forest:#31453a;--line:rgba(49,69,58,.18);--panel:#2b302b;--cream:#f4f0e7}*{box-sizing:border-box}html{background:var(--paper);scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f5f1e9,var(--paper));min-height:100vh}.top{position:fixed;z-index:20;inset:0 0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(238,233,223,.98) 65%,rgba(238,233,223,0))}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--forest);margin:0 0 5px}.top h1{font-size:17px;font-weight:500;margin:0}.top button{border:1px solid var(--line);background:rgba(255,255,255,.35);border-radius:999px;min-height:44px;padding:0 16px;color:var(--forest)}main{width:min(100%,720px);margin:auto;padding:125px 22px calc(80px + env(safe-area-inset-bottom));position:relative}.line{position:absolute;left:37px;top:125px;bottom:80px;width:1px;background:var(--line)}#timeline{display:flex;flex-direction:column;gap:34px}.day{min-height:335px;padding-left:43px;display:flex;align-items:center;position:relative}.day:before{content:"";position:absolute;left:10px;width:9px;height:9px;border-radius:50%;border:1px solid rgba(49,69,58,.45);background:var(--paper);box-shadow:0 0 0 7px rgba(238,233,223,.9)}.day.today:before{background:var(--forest)}.content{width:100%}.kicker{font-size:12px;letter-spacing:.22em;color:var(--forest);margin:0 0 12px}.flip{position:relative;width:min(100%,430px);height:170px;margin-bottom:20px;perspective:1000px}.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;background:linear-gradient(180deg,#373c37,#242824);color:#f2eee5;font:700 clamp(84px,22vw,150px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.08em;box-shadow:0 18px 45px rgba(40,38,32,.12)}.face:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);box-shadow:0 1px rgba(255,255,255,.05)}.today .face{background:linear-gradient(180deg,#35443a,#27332c)}.date{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:var(--muted);margin:0 0 14px}.weight{border:0;background:none;padding:0;color:var(--ink);display:inline-flex;align-items:baseline;gap:8px}.weight strong{font-size:44px;font-weight:500}.weight span,.muted{color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-top:10px}.status{font-size:14px;letter-spacing:.08em;color:var(--forest);margin:0 0 18px}.field{width:min(100%,430px);display:flex;align-items:center;border-bottom:1px solid rgba(49,69,58,.35)}.field input{width:100%;border:0;outline:0;background:none;color:var(--ink);font:600 clamp(44px,12vw,64px) ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 0}.field span{color:var(--muted)}.save{width:min(100%,430px);margin-top:16px;min-height:52px;border:0;border-radius:5px;background:var(--forest);color:#f5f1e9;font-weight:600;letter-spacing:.08em}.error{min-height:18px;font-size:13px;color:#80594f;margin:8px 0}.summary{width:min(100%,430px);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.row span{color:var(--muted)}.overlay{position:fixed;z-index:40;inset:0;background:rgba(25,28,24,.38);display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;background:var(--cream);border-radius:20px 20px 0 0;padding:14px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.16)}.sheet h2{margin:6px 0 18px;font-size:24px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{min-height:48px;border-radius:5px}.ghost{border:1px solid var(--line);background:transparent;color:var(--ink)}.primary{border:0;background:var(--forest);color:white}.remove{grid-column:1/-1;border:0;background:transparent;color:#80594f}.toast{position:fixed;z-index:60;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#242824;color:white;padding:11px 16px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.storage-note{display:none;position:fixed;z-index:30;left:16px;right:16px;top:calc(80px + env(safe-area-inset-top));padding:12px 14px;background:#fff7e7;border:1px solid #caa76b;border-radius:8px;font-size:13px}.storage-note.show{display:block}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}</style></head><body><header class="top"><div><p class="eyebrow">MOUNJARO JOURNEY</p><h1>猛健樂旅程</h1></div><button id="todayBtn">今天</button></header><div id="storageNote" class="storage-note">目前瀏覽器無法保存資料。請使用 Safari 一般模式，避免無痕瀏覽。</div><main><div class="line"></div><section id="timeline" aria-label="猛健樂旅程時間軸"></section></main><div id="overlay" class="overlay" role="dialog" aria-modal="true"><form id="editForm" class="sheet"><p id="editDay" class="eyebrow"></p><h2 id="editDate"></h2><div class="field"><input id="editWeight" type="number" min="30" max="300" step="0.1" inputmode="decimal"><span>kg</span></div><p id="editError" class="error"></p><div class="actions"><button type="button" id="cancel" class="ghost">取消</button><button type="submit" class="primary">儲存</button><button type="button" id="remove" class="remove">移除紀錄</button></div></form></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>(()=>{'use strict';const START='2026-07-09',START_WEIGHT=89.7,KEY='mounjaro-journey-data-v2';const timeline=document.getElementById('timeline'),overlay=document.getElementById('overlay'),editForm=document.getElementById('editForm'),editWeight=document.getElementById('editWeight'),editError=document.getElementById('editError'),removeBtn=document.getElementById('remove'),toast=document.getElementById('toast'),storageNote=document.getElementById('storageNote');let editing=null,today='';function taipei(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),m={};p.forEach(x=>m[x.type]=x.value);return `${m.year}-${m.month}-${m.day}`}function utc(k){const a=k.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])}function day(k){return Math.floor((utc(k)-utc(START))/86400000)+1}function fmt(k){return k.split('-').join(' / ')}function range(a,b){const out=[];for(let t=utc(a),e=utc(b);t<=e;t+=86400000)out.push(new Date(t).toISOString().slice(0,10));return out}function defaultState(){return{version:2,weights:{[START]:START_WEIGHT}}}function storageOK(){try{localStorage.setItem('__mj_test','1');localStorage.removeItem('__mj_test');return true}catch(e){return false}}const canStore=storageOK();if(!canStore)storageNote.classList.add('show');function load(){if(!canStore)return defaultState();try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw||typeof raw.weights!=='object')return defaultState();const clean=defaultState();Object.keys(raw.weights).forEach(k=>{const v=Number(raw.weights[k]);if(k>=START&&Number.isFinite(v)&&v>=30&&v<=300)clean.weights[k]=Math.round(v*10)/10});clean.weights[START]=START_WEIGHT;return clean}catch(e){return defaultState()}}let state=load();function save(){state.weights[START]=START_WEIGHT;if(!canStore)return false;try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){storageNote.classList.add('show');return false}}function prev(k){return Object.keys(state.weights).filter(x=>x<k).sort().pop()}function signed(n){return n>0?`+${n.toFixed(1)} kg`:n<0?`−${Math.abs(n).toFixed(1)} kg`:'0.0 kg'}function flip(n){const d=document.createElement('div');d.className='flip';d.innerHTML=`<div class="face" aria-label="第 ${n} 天">${n}</div>`;return d}function openEditor(k){if(k===START){say('Day 1 是固定起點');return}editing=k;document.getElementById('editDay').textContent=`DAY ${day(k)}`;document.getElementById('editDate').textContent=fmt(k);editWeight.value=state.weights[k]??'';editError.textContent='';removeBtn.style.display=state.weights[k]===undefined?'none':'block';overlay.classList.add('open');setTimeout(()=>editWeight.focus(),80)}function closeEditor(){overlay.classList.remove('open');editing=null;editWeight.blur()}function node(k){const n=document.createElement('article'),w=state.weights[k],isToday=k===today;n.className='day'+(isToday?' today':'');n.id=isToday?'today':'';const c=document.createElement('div');c.className='content';c.innerHTML=`<p class="kicker">${isToday?'TODAY · DAY':'DAY'}</p>`;c.appendChild(flip(day(k)));c.insertAdjacentHTML('beforeend',`<p class="date">${fmt(k)}</p>`);if(isToday&&w===undefined){c.insertAdjacentHTML('beforeend','<p class="status">今日未量測</p><form id="todayForm"><div class="field"><input id="todayInput" type="number" min="30" max="300" step="0.1" inputmode="decimal" placeholder="0.0" aria-label="今天體重"><span>kg</span></div><p id="todayError" class="error"></p><button class="save" type="submit">儲存今天</button></form>');setTimeout(()=>{const f=document.getElementById('todayForm');if(f)f.onsubmit=e=>{e.preventDefault();const input=document.getElementById('todayInput'),err=document.getElementById('todayError'),v=Number(input.value);if(!Number.isFinite(v)||v<30||v>300){err.textContent='請輸入 30–300 kg';return}state.weights[today]=Math.round(v*10)/10;if(save()||!canStore){render(true);say(canStore?'今天已紀錄':'本次暫存，關閉頁面後可能消失')}}},0)}else if(w!==undefined){const b=document.createElement('button');b.className='weight';b.type='button';b.innerHTML=`<strong>${w.toFixed(1)}</strong><span>kg</span>`;b.onclick=()=>openEditor(k);c.appendChild(b);if(isToday){const p=prev(k),s=document.createElement('div');s.className='summary';let h='';if(p){h+=`<div class="row"><span>距離上次量測</span><strong>${day(k)-day(p)} 天</strong></div><div class="row"><span>比上一次</span><strong>${signed(w-state.weights[p])}</strong></div>`}h+=`<div class="row"><span>從 Day 1 累計</span><strong>${signed(w-START_WEIGHT)}</strong></div>`;s.innerHTML=h;c.appendChild(s)}else c.insertAdjacentHTML('beforeend','<p class="hint">輕觸體重可修改</p>')}else{const b=document.createElement('button');b.className='weight';b.type='button';b.innerHTML='<span class="muted">未量測</span>';b.onclick=()=>openEditor(k);c.appendChild(b);c.insertAdjacentHTML('beforeend','<p class="hint">輕觸可補登</p>')}n.appendChild(c);return n}function render(stay=false){today=taipei();timeline.replaceChildren();range(START,today<START?START:today).forEach(k=>timeline.appendChild(node(k)));requestAnimationFrame(()=>document.getElementById('today')?.scrollIntoView({block:'end',behavior:'auto'}))}editForm.onsubmit=e=>{e.preventDefault();if(!editing)return;const v=Number(editWeight.value);if(!Number.isFinite(v)||v<30||v>300){editError.textContent='請輸入 30–300 kg';return}state.weights[editing]=Math.round(v*10)/10;save();closeEditor();render(true);say('體重已更新')};removeBtn.onclick=()=>{if(editing&&editing!==START){delete state.weights[editing];save();closeEditor();render(true);say('紀錄已移除')}};document.getElementById('cancel').onclick=closeEditor;overlay.onclick=e=>{if(e.target===overlay)closeEditor()};document.getElementById('todayBtn').onclick=()=>document.getElementById('today')?.scrollIntoView({behavior:'smooth',block:'end'});let tt;function say(m){clearTimeout(tt);toast.textContent=m;toast.classList.add('show');tt=setTimeout(()=>toast.classList.remove('show'),1800)}function refresh(){if(taipei()!==today)render()}document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('focus',refresh);setInterval(refresh,60000);render()})();</script></body></html>
