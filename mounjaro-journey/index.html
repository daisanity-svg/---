<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9df"><title>Mounjaro Journey</title>
<style>
:root{--paper:#eee9df;--cream:#f7f3ea;--ink:#252820;--muted:#74786e;--forest:#31453a;--line:rgba(49,69,58,.18);--danger:#80594f}*{box-sizing:border-box}html{background:var(--paper);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:linear-gradient(#f6f2e9,var(--paper));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.top{position:fixed;z-index:20;inset:0 0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(238,233,223,.98) 65%,rgba(238,233,223,0))}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--forest);margin:0 0 5px}.top h1{font-size:17px;font-weight:500;margin:0}.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.35);color:var(--forest)}main{width:min(100%,720px);margin:auto;padding:120px 20px calc(90px + env(safe-area-inset-bottom));position:relative}.line{position:absolute;left:35px;top:120px;bottom:80px;width:1px;background:var(--line)}#timeline{display:flex;flex-direction:column;gap:34px}.day{min-height:330px;padding-left:43px;display:flex;align-items:center;position:relative}.day:before{content:"";position:absolute;left:10px;width:9px;height:9px;border-radius:50%;border:1px solid rgba(49,69,58,.45);background:var(--paper);box-shadow:0 0 0 7px rgba(238,233,223,.9)}.today:before{background:var(--forest)}.content{width:100%}.kicker{font-size:12px;letter-spacing:.22em;color:var(--forest);margin:0 0 12px}.flip{width:min(100%,430px);height:165px;margin-bottom:20px;position:relative;perspective:1000px}.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;background:linear-gradient(#373c37,#242824);color:#f2eee5;font:700 clamp(82px,22vw,146px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.08em;box-shadow:0 18px 45px rgba(40,38,32,.12)}.face:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);box-shadow:0 1px rgba(255,255,255,.05)}.today .face{background:linear-gradient(#35443a,#27332c)}.date{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:var(--muted);margin:0 0 14px}.weight{border:0;background:none;padding:0;color:var(--ink);display:inline-flex;align-items:baseline;gap:8px}.weight strong{font-size:44px;font-weight:500}.weight span,.muted{color:var(--muted)}.hint,.meta{font-size:12px;color:var(--muted);margin:10px 0 0}.meta{display:flex;gap:12px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--forest)}.quick{width:min(100%,430px)}.field{display:flex;align-items:center;border-bottom:1px solid rgba(49,69,58,.35)}.field input{width:100%;border:0;outline:0;background:none;color:var(--ink);font:600 clamp(42px,12vw,62px) ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 0}.field span{color:var(--muted)}.save{width:100%;margin-top:16px;min-height:52px;border:0;border-radius:6px;background:var(--forest);color:#f5f1e9;font-weight:600}.error{min-height:18px;font-size:13px;color:var(--danger);margin:8px 0}.summary{width:min(100%,430px);margin-top:22px;border-top:1px solid var(--line);padding-top:10px}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.row span{color:var(--muted)}.overlay{position:fixed;z-index:40;inset:0;background:rgba(25,28,24,.4);display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--cream);border-radius:22px 22px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.18)}.handle{width:42px;height:5px;border-radius:999px;background:rgba(49,69,58,.2);margin:0 auto 16px}.sheet h2{margin:5px 0 4px;font-size:25px}.sheet-date{color:var(--muted);margin:0 0 20px}.section{padding:18px 0;border-top:1px solid var(--line)}.section h3{font-size:13px;letter-spacing:.12em;color:var(--forest);margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input{display:block}.input.full{grid-column:1/-1}.input span{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.input div{display:flex;align-items:center;border-bottom:1px solid rgba(49,69,58,.28)}.input input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:9px 0;font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}.input em{font-style:normal;color:var(--muted);font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));padding:14px 0 calc(22px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--cream) 80%,transparent)}.actions button{min-height:50px;border-radius:6px}.ghost{border:1px solid var(--line);background:transparent;color:var(--ink)}.primary{border:0;background:var(--forest);color:white}.remove{grid-column:1/-1;border:0;background:transparent;color:var(--danger)}.toast{position:fixed;z-index:60;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#242824;color:white;padding:11px 16px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.storage-note{display:none;position:fixed;z-index:30;left:16px;right:16px;top:calc(78px + env(safe-area-inset-top));padding:12px 14px;background:#fff7e7;border:1px solid #caa76b;border-radius:8px;font-size:13px}.storage-note.show{display:block}@media(max-width:380px){.grid{grid-template-columns:1fr}.input.full{grid-column:auto}.day{padding-left:38px}main{padding-left:16px;padding-right:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><div><p class="eyebrow">MOUNJARO JOURNEY</p><h1>猛健樂旅程</h1></div><button id="todayBtn" class="pill">今天</button></header><div id="storageNote" class="storage-note">目前瀏覽器無法保存資料。請使用 Safari 一般模式，避免無痕瀏覽。</div><main><div class="line"></div><section id="timeline" aria-label="猛健樂旅程時間軸"></section></main>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><form id="recordForm" class="sheet"><div class="handle"></div><p id="sheetDay" class="eyebrow"></p><h2 id="sheetTitle">身體組成紀錄</h2><p id="sheetDate" class="sheet-date"></p>
<section class="section"><h3>本次量測</h3><div class="grid">
<label class="input"><span>體重 BW</span><div><input name="weight" type="number" min="30" max="300" step="0.1" inputmode="decimal"><em>kg</em></div></label><label class="input"><span>身高 BH</span><div><input name="height" type="number" min="100" max="230" step="0.1" inputmode="decimal"><em>cm</em></div></label><label class="input"><span>BMI</span><div><input name="bmi" type="number" min="5" max="80" step="0.1" inputmode="decimal"><em></em></div></label><label class="input"><span>體脂肪</span><div><input name="bodyFat" type="number" min="1" max="75" step="0.1" inputmode="decimal"><em>%</em></div></label><label class="input"><span>內臟脂肪</span><div><input name="visceralFat" type="number" min="1" max="60" step="0.5" inputmode="decimal"><em></em></div></label><label class="input"><span>基礎代謝</span><div><input name="bmr" type="number" min="500" max="5000" step="1" inputmode="numeric"><em>kcal</em></div></label><label class="input"><span>體年齡</span><div><input name="bodyAge" type="number" min="1" max="120" step="1" inputmode="numeric"><em>歲</em></div></label><label class="input"><span>猛健樂劑量</span><div><input name="dose" type="number" min="0" max="30" step="0.5" inputmode="decimal"><em>mg</em></div></label></div></section>
<section class="section"><h3>皮下脂肪率</h3><div class="grid"><label class="input"><span>全身</span><div><input name="subcutaneousWhole" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label><label class="input"><span>軀幹</span><div><input name="subcutaneousTrunk" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label><label class="input"><span>雙臂</span><div><input name="subcutaneousArms" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label><label class="input"><span>雙腳</span><div><input name="subcutaneousLegs" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label></div></section>
<section class="section"><h3>骨骼肌率</h3><div class="grid"><label class="input"><span>全身</span><div><input name="muscleWhole" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label><label class="input"><span>軀幹</span><div><input name="muscleTrunk" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label><label class="input"><span>雙臂</span><div><input name="muscleArms" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label><label class="input"><span>雙腳</span><div><input name="muscleLegs" type="number" step="0.1" inputmode="decimal"><em>%</em></div></label></div></section><p id="formError" class="error"></p><div class="actions"><button type="button" id="cancel" class="ghost">取消</button><button type="submit" class="primary">儲存紀錄</button><button type="button" id="remove" class="remove">移除這天的量測資料</button></div></form></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';const START='2026-07-09',START_WEIGHT=89.7,OLD_KEY='mounjaro-journey-data-v2',KEY='mounjaro-journey-data-v3';const $=s=>document.querySelector(s),timeline=$('#timeline'),overlay=$('#overlay'),form=$('#recordForm'),error=$('#formError'),removeBtn=$('#remove'),toast=$('#toast'),storageNote=$('#storageNote');let editing=null,today='',state;const fields=['weight','height','bmi','bodyFat','visceralFat','bmr','bodyAge','dose','subcutaneousWhole','subcutaneousTrunk','subcutaneousArms','subcutaneousLegs','muscleWhole','muscleTrunk','muscleArms','muscleLegs'];function taipei(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),m={};p.forEach(x=>m[x.type]=x.value);return `${m.year}-${m.month}-${m.day}`}function utc(k){const a=k.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])}function day(k){return Math.floor((utc(k)-utc(START))/86400000)+1}function fmt(k){return k.split('-').join(' / ')}function range(a,b){const out=[];for(let t=utc(a),e=utc(b);t<=e;t+=86400000)out.push(new Date(t).toISOString().slice(0,10));return out}function storageOK(){try{localStorage.setItem('__mj','1');localStorage.removeItem('__mj');return true}catch(e){return false}}const canStore=storageOK();if(!canStore)storageNote.classList.add('show');function defaults(){return{version:3,records:{[START]:{weight:START_WEIGHT}}}}function cleanRecord(r={}){const o={};fields.forEach(f=>{const v=Number(r[f]);if(r[f]!==''&&r[f]!=null&&Number.isFinite(v))o[f]=Math.round(v*10)/10});return o}function load(){if(!canStore)return defaults();try{let raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw){const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');if(old?.weights){raw=defaults();Object.entries(old.weights).forEach(([k,v])=>raw.records[k]={weight:Number(v)})}}if(!raw||typeof raw.records!=='object')raw=defaults();const out=defaults();Object.entries(raw.records).forEach(([k,v])=>{if(k>=START&&k<=taipei())out.records[k]=cleanRecord(v)});out.records[START]={...out.records[START],weight:START_WEIGHT};return out}catch(e){return defaults()}}state=load();function save(){state.records[START]={...state.records[START],weight:START_WEIGHT};if(!canStore)return false;try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){storageNote.classList.add('show');return false}}function measuredKeys(before){return Object.keys(state.records).filter(k=>state.records[k]?.weight!=null&&(!before||k<before)).sort()}function prev(k){return measuredKeys(k).pop()}function signed(n){return n>0?`+${n.toFixed(1)} kg`:n<0?`−${Math.abs(n).toFixed(1)} kg`:'0.0 kg'}function flip(n){const d=document.createElement('div');d.className='flip';d.innerHTML=`<div class="face" aria-label="第 ${n} 天">${n}</div>`;return d}function recordCount(r){return fields.filter(f=>r?.[f]!=null).length}function openEditor(k){if(k===START){say('Day 1 為固定起點；其他身體組成可在後續日期記錄');return}editing=k;$('#sheetDay').textContent=`DAY ${day(k)}`;$('#sheetDate').textContent=fmt(k);const r=state.records[k]||{};fields.forEach(f=>form.elements[f].value=r[f]??'');error.textContent='';removeBtn.style.display=recordCount(r)?'block':'none';overlay.classList.add('open');setTimeout(()=>form.elements.weight.focus(),80)}function closeEditor(){overlay.classList.remove('open');editing=null;form.reset()}function quickSave(v){if(!Number.isFinite(v)||v<30||v>300)return false;state.records[today]={...(state.records[today]||{}),weight:Math.round(v*10)/10};save();render();say('今天已紀錄');return true}function node(k){const n=document.createElement('article'),r=state.records[k]||{},w=r.weight,isToday=k===today;n.className='day'+(isToday?' today':'');if(isToday)n.id='today';const c=document.createElement('div');c.className='content';c.innerHTML=`<p class="kicker">${isToday?'TODAY · DAY':'DAY'}</p>`;c.appendChild(flip(day(k)));c.insertAdjacentHTML('beforeend',`<p class="date">${fmt(k)}</p>`);if(isToday&&w==null){c.insertAdjacentHTML('beforeend','<p class="muted">今日未量測</p><form class="quick" id="quick"><div class="field"><input id="quickWeight" type="number" min="30" max="300" step="0.1" inputmode="decimal" placeholder="0.0" aria-label="今天體重"><span>kg</span></div><p id="quickError" class="error"></p><button class="save">儲存今天體重</button></form><button class="weight hint" id="fullToday" type="button">改為填寫完整診所紀錄</button>');setTimeout(()=>{$('#quick').onsubmit=e=>{e.preventDefault();const v=Number($('#quickWeight').value);if(!quickSave(v))$('#quickError').textContent='請輸入 30–300 kg'};$('#fullToday').onclick=()=>openEditor(today)},0)}else if(w!=null){const b=document.createElement('button');b.className='weight';b.type='button';b.innerHTML=`<strong>${w.toFixed(1)}</strong><span>kg</span>`;b.onclick=()=>openEditor(k);c.appendChild(b);const count=recordCount(r);c.insertAdjacentHTML('beforeend',`<div class="meta">${r.dose!=null?`<span class="tag">${r.dose} mg</span>`:''}${count>1?`<span class="tag">身體組成 ${count-1} 項</span>`:''}</div><p class="hint">輕觸查看或修改完整紀錄</p>`);if(isToday){const p=prev(k),s=document.createElement('div');s.className='summary';let h='';if(p){h+=`<div class="row"><span>距離上次量測</span><strong>${day(k)-day(p)} 天</strong></div><div class="row"><span>比上一次</span><strong>${signed(w-state.records[p].weight)}</strong></div>`}h+=`<div class="row"><span>從 Day 1 累計</span><strong>${signed(w-START_WEIGHT)}</strong></div>`;s.innerHTML=h;c.appendChild(s)}}else{const b=document.createElement('button');b.className='weight';b.type='button';b.innerHTML='<span class="muted">未量測</span>';b.onclick=()=>openEditor(k);c.appendChild(b);c.insertAdjacentHTML('beforeend','<p class="hint">輕觸可補登體重或完整診所紀錄</p>')}n.appendChild(c);return n}function render(){today=taipei();timeline.replaceChildren();range(START,today<START?START:today).forEach(k=>timeline.appendChild(node(k)));requestAnimationFrame(()=>$('#today')?.scrollIntoView({block:'end',behavior:'auto'}))}form.onsubmit=e=>{e.preventDefault();if(!editing)return;const r={};fields.forEach(f=>{const raw=form.elements[f].value;if(raw!=='')r[f]=Math.round(Number(raw)*10)/10});if(r.weight!=null&&(r.weight<30||r.weight>300)){error.textContent='體重請輸入 30–300 kg';return}if(r.height!=null&&(r.height<100||r.height>230)){error.textContent='身高請輸入 100–230 cm';return}if(!Object.keys(r).length){error.textContent='請至少輸入一項資料';return}state.records[editing]=r;save();closeEditor();render();say('完整紀錄已儲存')};removeBtn.onclick=()=>{if(editing&&editing!==START){delete state.records[editing];save();closeEditor();render();say('這天的量測資料已移除')}};$('#cancel').onclick=closeEditor;overlay.onclick=e=>{if(e.target===overlay)closeEditor()};$('#todayBtn').onclick=()=>$('#today')?.scrollIntoView({behavior:'smooth',block:'end'});let tt;function say(m){clearTimeout(tt);toast.textContent=m;toast.classList.add('show');tt=setTimeout(()=>toast.classList.remove('show'),1900)}function refresh(){if(taipei()!==today)render()}document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('focus',refresh);setInterval(refresh,60000);render()})();
</script></body></html>
