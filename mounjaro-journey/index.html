<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee9df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="猛健樂旅程">
  <title>猛健樂旅程</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MOUNJARO JOURNEY</p>
      <h1>猛健樂旅程</h1>
    </div>
    <button id="todayBtn" class="pill" type="button">今天</button>
  </header>

  <main>
    <section id="hero" class="hero" aria-live="polite"></section>
    <div class="timeline-line" aria-hidden="true"></div>
    <section id="timeline" class="timeline" aria-label="每日紀錄"></section>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <form id="recordForm" class="sheet">
      <div class="handle"></div>
      <p id="sheetDay" class="eyebrow"></p>
      <h2>每日量測</h2>
      <p id="sheetDate" class="sheet-date"></p>

      <div class="horizontal-fields">
        <label>
          <span>體重</span>
          <div><input name="weight" type="number" min="30" max="300" step="0.1" inputmode="decimal"><em>kg</em></div>
        </label>
        <label>
          <span>體脂肪率</span>
          <div><input name="bodyFat" type="number" min="1" max="75" step="0.1" inputmode="decimal"><em>%</em></div>
        </label>
        <label>
          <span>內臟脂肪</span>
          <div><input name="visceralFat" type="number" min="1" max="60" step="0.5" inputmode="decimal"><em></em></div>
        </label>
      </div>

      <p id="formError" class="error"></p>
      <div class="sheet-actions">
        <button id="cancelBtn" class="ghost" type="button">取消</button>
        <button class="primary" type="submit">儲存</button>
        <button id="deleteBtn" class="delete" type="button">刪除這天紀錄</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer>v4.0 · 僅記錄體重、體脂肪率、內臟脂肪</footer>

  <script src="app.js" defer></script>
</body>
</html>
